[build]
  command = "npm run build"
  publish = ".next"

# The Next.js plugin is automatically installed by Netlify,
# but it's good practice to specify it for explicit compatibility.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Basic cache control for static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
